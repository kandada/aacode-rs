[package]
name = "aacode-rs"
version = "1.8.8"
edition = "2021"
description = "Rust port of the AACode ReAct coding agent, built on fastshell for mobile AI agents"
license = "GPL-3.0-only"
authors = ["xiefujin <490021684@qq.com>"]
repository = "https://github.com/kandada/aacode-rs"
homepage = "https://github.com/kandada/aacode-rs"
documentation = "https://docs.rs/aacode-rs"
readme = "README.md"
keywords = ["ai-agent", "coding-agent", "react", "llm", "shell"]
categories = ["command-line-utilities", "development-tools", "embedded"]

[lib]
name = "aacode_rs"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "aacode"
path = "src/bin/aacode.rs"

[dependencies]
fastshell = { path = "../fastshell", version = "0.3.3", features = ["git", "python-rustpython", "js-oxc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "time"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "rustls-tls"], default-features = false }
futures = "0.3"
bytes = "1"
async-trait = "0.1"

[dev-dependencies]
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
