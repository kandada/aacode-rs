[package]
name = "aacode-rs"
version = "1.7.24"
edition = "2021"
description = "Rust port of the AACode ReAct coding agent, built on fastshell for mobile AI agents"
license = "GPL-3.0-only"
authors = ["xiefujin <490021684@qq.com>"]

[lib]
name = "aacode_rs"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "aacode"
path = "src/bin/aacode.rs"

[dependencies]
# Development: when fastshell sits alongside at ../fastshell, use the path dep.
# Standalone: replace with git dep after fastshell is published.
#   fastshell = { git = "https://github.com/xxx/fastshell", rev = "v0.2.2" }
# Features:
#   * "git"              — built-in git2-rs engine (required by AACodeApp).
#   * "python-rustpython"— embedded RustPython (pure Rust; replaces the former
#     Chaquopy CPython which crashed on real devices). LGPL malachite deps are
#     replaced by clean-room shims — see fastshell/num_bigint/README.md.
fastshell = { path = "../fastshell", features = ["git", "python-rustpython"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tiny_http = "0.12"
